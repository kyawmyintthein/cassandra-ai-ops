[project]
name = "cassandra-ai-ops"
version = "0.1.0"
description = "Intake service for Cassandra AI Ops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "services/intake_service/src"}

[tool.setuptools.packages.find]
where = ["services/intake_service/src"]

[tool.pytest.ini_options]
pythonpath = [
  "services/intake_service/src",
]
testpaths = [
  "services/intake_service/tests",
]

